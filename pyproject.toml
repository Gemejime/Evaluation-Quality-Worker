[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-governance-worker"
version = "0.1.0"
description = "RAG Evaluation and Governance Batch Compute Microservice"
readme = "GEMINI.MD"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gemejime Platform Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "prometheus-client>=0.20.0",
    "temporalio>=1.6.0",
    "structlog>=24.4.0",
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
    "httpx>=0.27.0",
    "clickhouse-connect>=0.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-protobuf>=5.27.0",
    "grpcio-tools>=1.84.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["api/proto/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "ASYNC", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "clickhouse_connect.*",
    "temporalio.*",
    "grpc_tools.*",
    "api.proto.v1.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["."]
addopts = "-p no:faker"
