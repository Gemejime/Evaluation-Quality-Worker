name: CI - RAG Evaluation & Governance Worker

on:
  push:
    branches:
      - main
      - rag-eval-governance-worker
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - rag-eval-governance-worker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting & Typecheck Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic types-protobuf

      - name: Run Ruff Lint Check
        run: |
          python -m ruff check .

      - name: Run Ruff Format Verification
        run: |
          python -m ruff format --check .

      - name: Run Static Type Analysis (mypy)
        run: |
          TARGETS=""
          for dir in cmd internal test; do
            if [ -d "$dir" ]; then
              TARGETS="$TARGETS $dir"
            fi
          done
          if [ -n "$TARGETS" ]; then
            python -m mypy --ignore-missing-imports $TARGETS
          else
            echo "No source directories (cmd, internal, test) found; skipping mypy."
          fi

  test-suite:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          if [ -f pyproject.toml ]; then
            pip install -e ".[test]"
          fi

      - name: Run Unit Tests
        run: |
          if [ -d "test/unit" ]; then
            python -m pytest test/unit -v --durations=10
          else
            echo "No test/unit directory present yet; skipping unit tests."
          fi

      - name: Run Integration Tests
        run: |
          if [ -d "test/integration" ]; then
            python -m pytest test/integration -v --durations=10
          else
            echo "No test/integration directory present yet; skipping integration tests."
          fi

  golden-set-eval-gate:
    name: Golden-Set Regression Quality Gate
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Quality Gate Thresholds
        run: |
          echo "Executing golden-set evaluator and verifying quality gates (tau >= 0.82)..."
          python -c "
          import sys, os, subprocess, json

          MIN_THRESHOLDS = {
              'faithfulness': 0.82,
              'context_precision': 0.82,
              'answer_relevance': 0.82,
          }

          evaluator_module = 'internal.evaluation.runner'
          evaluator_file = 'internal/evaluation/runner.py'
          golden_set_file = 'test/fixtures/golden_set.json'

          if not os.path.exists(evaluator_file):
              print(f'Evaluator {evaluator_file} does not exist yet (queued for Phase 2). Skipping golden-set regression gate.')
              sys.exit(0)

          cmd = [sys.executable, '-m', evaluator_module, '--golden-set', golden_set_file]
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
              results = json.loads(proc.stdout)
          except subprocess.CalledProcessError as e:
              print(f'FATAL: Evaluator process failed with code {e.returncode}: {e.stderr}', file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f'FATAL: Failed to execute evaluator or parse output: {e}', file=sys.stderr)
              sys.exit(1)

          for metric, min_val in MIN_THRESHOLDS.items():
              if metric not in results or results[metric] is None:
                  print(f'FATAL: Required metric score \"{metric}\" is missing or unavailable.', file=sys.stderr)
                  sys.exit(1)
              val = float(results[metric])
              if val < min_val:
                  print(f'FAILURE: Quality gate threshold breached for {metric}: {val:.4f} < {min_val:.2f}', file=sys.stderr)
                  sys.exit(1)
              print(f'SUCCESS: {metric}: {val:.4f} >= {min_val:.2f}')

          print('All quality gate thresholds passed.')
          "

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfile Build
        run: |
          if [ -f "deployments/docker/Dockerfile" ]; then
            docker build -f deployments/docker/Dockerfile -t rag-eval-governance-worker:ci .
          else
            echo "deployments/docker/Dockerfile not yet present; skipping container build."
          fi
