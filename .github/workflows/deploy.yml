name: Deploy - RAG Evaluation & Governance Worker

on:
  push:
    branches:
      - main
    paths:
      - "deployments/**"
      - "internal/**"
      - "cmd/**"
      - "pyproject.toml"
      - ".env.prod"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-to-kubernetes:
    name: Kubernetes Deploy & Secret Injection
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Ensure Kubernetes Namespaces Exist
        run: |
          kubectl create namespace rag-evaluation --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace storage --dry-run=client -o yaml | kubectl apply -f -

      - name: "Inject Worker Secret (Method 1: CI/CD Secret Injection)"
        env:
          PROD_CLICKHOUSE_PASSWORD: ${{ secrets.PROD_CLICKHOUSE_PASSWORD }}
        run: |
          echo "Injecting runtime secret for rag-eval-governance-worker..."
          if [ -z "$PROD_CLICKHOUSE_PASSWORD" ]; then
            echo "Error: PROD_CLICKHOUSE_PASSWORD is not set or empty" >&2
            exit 1
          fi
          printf '%s' "$PROD_CLICKHOUSE_PASSWORD" | kubectl create secret generic rag-eval-worker-secret \
            --from-file=CLICKHOUSE_PASSWORD=/dev/stdin \
            --namespace rag-evaluation \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Inject ClickHouse Operator Secret
        env:
          PROD_CLICKHOUSE_PASSWORD: ${{ secrets.PROD_CLICKHOUSE_PASSWORD }}
        run: |
          echo "Injecting credential secret for ClickHouse operator..."
          if [ -z "$PROD_CLICKHOUSE_PASSWORD" ]; then
            echo "Error: PROD_CLICKHOUSE_PASSWORD is not set or empty" >&2
            exit 1
          fi
          printf '%s' "$PROD_CLICKHOUSE_PASSWORD" | kubectl create secret generic clickhouse-eval-worker-secret \
            --from-file=password=/dev/stdin \
            --namespace storage \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Helm Chart
        run: |
          echo "Deploying rag-eval-governance-worker via Helm..."
          helm upgrade --install rag-eval-governance-worker deployments/helm \
            --namespace rag-evaluation \
            --values deployments/helm/values.yaml

      - name: Verify Deployment Rollout
        run: |
          echo "Verifying rollout status..."
          if kubectl get rollout rag-eval-governance-worker --namespace rag-evaluation >/dev/null 2>&1; then
            echo "Checking Argo Rollout status..."
            kubectl argo rollouts status rollout/rag-eval-governance-worker \
              --namespace rag-evaluation \
              --timeout=180s
          else
            echo "Checking Deployment rollout status..."
            kubectl rollout status deployment/rag-eval-governance-worker \
              --namespace rag-evaluation \
              --timeout=180s
          fi
