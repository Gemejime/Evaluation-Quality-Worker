# Default values for rag-eval-governance-worker Helm chart.

replicaCount: 2

image:
  repository: rag-eval-governance-worker
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 8080
  grpcPort: 50051

env:
  LD_PRELOAD: "/usr/lib/x86_64-linux-gnu/libjemalloc.so"
  ENVIRONMENT: "production"
  TEMPORAL_HOST: "temporal.default.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  EVAL_TASK_QUEUE: "eval-task-queue"
  ACTIVITY_HEARTBEAT_INTERVAL_SECONDS: "10.0"
  ACTIVITY_HEARTBEAT_TIMEOUT_SECONDS: "30.0"
  JUDGE_ENDPOINT: "http://rag-inference-serving:8001"
  JUDGE_MODEL: "meta-llama/Llama-3.1-70B-Instruct"
  JUDGE_MAX_CONCURRENT_REQUESTS: "20"
  JUDGE_RATE_LIMIT_RPS: "50.0"
  CLICKHOUSE_HOST: "clickhouse.storage.svc.cluster.local"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_DATABASE: "rag_governance"
  CLICKHOUSE_BATCH_SIZE: "1000"
  CLICKHOUSE_FLUSH_INTERVAL_SECONDS: "1.0"
  QUALITY_GATE_MIN_FAITHFULNESS: "0.82"
  QUALITY_GATE_MIN_CONTEXT_PRECISION: "0.82"
  QUALITY_GATE_MIN_ANSWER_RELEVANCE: "0.82"

# Node sizing calibrated for compute-optimized c6i.2xlarge instances
resources:
  requests:
    cpu: "2000m"
    memory: "2Gi"
  limits:
    cpu: "4000m"
    memory: "3.5Gi"

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# KEDA Horizontal Pod Autoscaling configuration
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 300
  prometheusServerAddress: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
  threshold: "5"
  query: 'sum(temporal_activity_schedule_to_start_latency_seconds_count{task_queue="eval-task-queue"})'

# Argo Rollouts progressive canary delivery configuration
rollout:
  enabled: false

