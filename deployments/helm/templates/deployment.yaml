{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-eval-governance-worker.fullname" . }}
  labels:
    {{- include "rag-eval-governance-worker.labels" . | nindent 4 }}
spec:
  {{- if not (and .Values.keda .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rag-eval-governance-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-eval-governance-worker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: evaluation-worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http-probes
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rag-eval-governance-worker.fullname" . }}-config
            {{- if .Values.env.secretName }}
            - secretRef:
                name: {{ .Values.env.secretName }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
