apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rag-eval-governance-worker
  namespace: rag-evaluation
  labels:
    app.kubernetes.io/name: rag-eval-governance-worker
    app.kubernetes.io/instance: rag-eval-governance-worker
    app.kubernetes.io/component: evaluation-worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-eval-governance-worker
      app.kubernetes.io/instance: rag-eval-governance-worker
  strategy:
    canary:
      canaryService: rag-eval-governance-worker-canary
      stableService: rag-eval-governance-worker-stable
      trafficRouting:
        nginx:
          stableIngress: rag-eval-governance-worker-ingress
      steps:
        # Phase 1: 20% Canary with Quality Gate Verification
        - setWeight: 20
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: rag-eval-governance-worker-quality-gate
            args:
              - name: service-name
                value: rag-eval-governance-worker
        # Phase 2: 50% Canary with Prolonged Quality Gate Soak Verification
        - setWeight: 50
        - pause: { duration: 10m }
        - analysis:
            templates:
              - templateName: rag-eval-governance-worker-quality-gate
            args:
              - name: service-name
                value: rag-eval-governance-worker
        # Phase 3: Full 100% Promotion
        - setWeight: 100
        - pause: { duration: 5m }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-eval-governance-worker
        app.kubernetes.io/instance: rag-eval-governance-worker
        app.kubernetes.io/component: evaluation-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: rag-eval-governance-worker
          image: rag-eval-governance-worker:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-probes
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rag-eval-governance-worker-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "2000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "3.5Gi"
